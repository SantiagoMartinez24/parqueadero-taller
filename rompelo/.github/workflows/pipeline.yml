# PIPELINE · Sistema de Parqueadero
# Se ejecuta solo, en cada cambio. Si la arquitectura se viola, NO despliega.
name: Verificar arquitectura y desplegar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verificar:
    name: 1. Verificar la arquitectura
    runs-on: ubuntu-latest
    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Funcion de aptitud - las reglas del ADR
        run: node tools/verificar-arquitectura.js

  desplegar:
    name: 2. Desplegar a GitHub Pages
    needs: verificar          # <-- si el paso 1 falla, este NUNCA corre
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
